<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refrankenstein</title>
<meta name="description" content="Refráns en galego, castelán, catalán e euskera. Mestúraos, vota os teus favoritos e achega os que coñezas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF4; --paper:#FBFCFE; --ink:#16203F; --soft:#5A6585;
  --head:#2340B5; --headbg:#DCE3FA; --tail:#9A6A00; --tailbg:#FCEFC4; --seam:#F2B705;
  --line:#C9D1E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1528; --paper:#18203A; --ink:#E8ECF7; --soft:#9AA5C4;
    --head:#9DB0FF; --headbg:#22306B; --tail:#FFD15C; --tailbg:#4A3A10; --seam:#F2B705; --line:#2C365A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1528; --paper:#18203A; --ink:#E8ECF7; --soft:#9AA5C4;
  --head:#9DB0FF; --headbg:#22306B; --tail:#FFD15C; --tailbg:#4A3A10; --seam:#F2B705; --line:#2C365A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:2rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--head)} h1 em{font-style:normal;color:var(--tail)}
.flags{display:flex;gap:6px}
.flags button{border:2px solid transparent;background:none;padding:2px;border-radius:6px;cursor:pointer;line-height:0}
.flags button[aria-pressed="true"]{border-color:var(--ink)}
.flags svg{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;margin:18px 0 20px;background:var(--paper);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--soft);font:500 .95rem Rubik,sans-serif;padding:10px 6px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:3px solid var(--seam);outline-offset:2px}

/* The split card */
.card{background:var(--paper);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.half{padding:26px 22px;font-family:"Young Serif",Georgia,serif;font-size:clamp(1.45rem,5.4vw,2rem);line-height:1.25;position:relative}
.half.h{background:var(--headbg);color:var(--head)}
.half.t{background:var(--tailbg);color:var(--tail)}
.seam{height:6px;background:repeating-linear-gradient(90deg,var(--seam) 0 14px,transparent 14px 22px)}
.tag{display:inline-block;font:500 .75rem Rubik,sans-serif;color:var(--soft);padding:10px 22px 0}
.card .tag + .half{padding-top:12px}
.half.in-l{animation:inl .35s ease-out}
.half.in-r{animation:inr .35s ease-out}
@keyframes inl{from{transform:translateX(-30px);opacity:0}}
@keyframes inr{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.half.in-l,.half.in-r{animation:none}}

.origin{font-size:.88rem;color:var(--soft);padding:14px 22px 18px;border-top:1px solid var(--line)}
.origin b{font-weight:500;color:var(--ink)}
.origin p{margin:4px 0}
.origin .dh{color:var(--head)} .origin .dt{color:var(--tail)}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:500 1rem Rubik,sans-serif;cursor:pointer;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:1 1 100%;font-size:1.1rem;padding:15px}
.btn.h{color:var(--head)} .btn.t{color:var(--tail)}
.btn.sm{padding:9px 12px;font-size:.9rem}
.row{display:flex;gap:8px;flex:1 1 100%}
.row .btn{flex:1}

.toggle{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:6px}
.toggle button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:500 .9rem Rubik,sans-serif;color:var(--soft);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--seam);color:#16203F}
.hint{font-size:.85rem;color:var(--soft);margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:5px 12px;font:500 .85rem Rubik,sans-serif;margin-bottom:12px;cursor:pointer}

h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.3rem;margin:30px 0 10px}
.favs{list-style:none;margin:0;padding:0}
.favs li{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-family:"Young Serif",Georgia,serif;font-size:1.05rem}
.favs li span{flex:1}
.favs .x{border:0;background:none;color:var(--soft);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.empty{color:var(--soft);font-size:.95rem}

.intro{font-size:1rem;margin:0 0 10px}
.legend{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
.legend span{padding:6px 12px;border-radius:8px;font-weight:500;font-size:.9rem}
.legend .lh{background:var(--headbg);color:var(--head)} .legend .lt{background:var(--tailbg);color:var(--tail)}
.big{font-family:"Young Serif",Georgia,serif;font-size:1.15rem;margin:18px 0 6px}
.fam{border-top:1px solid var(--line);padding:14px 0}
.fam-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fam-name{font-family:"Young Serif",Georgia,serif;font-size:1.15rem}
.fam-n{font-size:.85rem;color:var(--soft)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--head) 0 50%,var(--seam) 50%)}
.ex{font-size:.9rem;margin:0 0 8px}
.ex .eh{color:var(--head)} .ex .et{color:var(--tail)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;font-weight:500;transition:transform .25s;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0)}
#fams h3{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.4rem;margin:28px 0 6px}
#fams h3 small{font-family:Rubik,sans-serif;font-size:.85rem;color:var(--soft)}
.origin small{color:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}
.tabs button{padding:10px 2px;font-size:.85rem}
.foot{font-size:.82rem;color:var(--soft);padding:10px 22px 14px;border-top:1px solid var(--line)}
#randVote{display:inline-flex}
.vote{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 14px;font:500 1rem Rubik,sans-serif;cursor:pointer;white-space:nowrap}
.vote[aria-pressed="true"]{background:#E0365A;border-color:#E0365A;color:#fff}
.vote b{font-weight:500}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
ol.list{counter-reset:n}
ol.list li:not(.empty)::before{counter-increment:n;content:counter(n);font-family:"Young Serif",Georgia,serif;color:var(--soft);min-width:1.4em}
.list .rt{flex:1;font-family:"Young Serif",Georgia,serif;font-size:1.02rem;line-height:1.35}
.list .rt small{display:block;font-family:Rubik,sans-serif;font-size:.78rem;color:var(--soft);margin-top:3px}
.eh{color:var(--head)} .et{color:var(--tail)}
.st{font-size:.78rem;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--line)}
.st.ok{background:#1E9E62;color:#fff} .st.no{background:#B33A3A;color:#fff}
.modbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn.ok{background:#1E9E62;color:#fff;border-color:#1E9E62}
.form{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500;color:var(--soft)}
.form input,.form select{font:400 1.05rem Rubik,sans-serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.form .lh2 input{border-left:5px solid var(--head)} .form .lt2 input{border-left:5px solid var(--seam)}
.form .hint{margin:-6px 0 0}
.prev{background:var(--bg);border-radius:10px;padding:10px 12px}
.prev small{color:var(--soft)} .prev p{margin:4px 0 0;font-family:"Young Serif",Georgia,serif;font-size:1.15rem}
.err{color:#C0392B;font-weight:500;margin:0;min-height:1em}
.note{background:var(--tailbg);color:var(--ink);padding:12px 14px;border-radius:12px}
.form textarea{font:400 1rem Rubik,sans-serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;resize:vertical}
.chk{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:.95rem!important}
.chk input{width:22px;height:22px;accent-color:var(--head);flex:none}
.sim{background:var(--headbg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.sim b{font-family:"Young Serif",Georgia,serif;font-weight:400;color:var(--head)}
.sim small{display:block;color:var(--soft);margin-top:4px}
.mod{flex-direction:column;align-items:stretch!important}
.mod input,.mod textarea{font:400 .95rem Rubik,sans-serif;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.mod .row2{display:flex;gap:6px}
.mod .row2 input:first-child{border-left:4px solid var(--head)} .mod .row2 input:last-child{border-left:4px solid var(--seam)}
.mod small{color:var(--soft);font-size:.8rem}
.x2{border:0;background:none;color:var(--soft);cursor:pointer;font-size:1rem;padding:4px 8px}
.search{font:400 1.05rem Rubik,sans-serif;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%;margin-bottom:6px}
.tag.today{color:var(--tail);font-weight:700}
mark{background:var(--seam);color:#16203F;border-radius:3px;padding:0 2px}
.adm{margin-top:36px;color:var(--soft);font-size:.9rem}
.adm summary{cursor:pointer;padding:6px 0}
.adm .form{margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Refrank</span><em>enstein</em></h1>
    <div class="flags" role="group" aria-label="Idioma">
      <button data-lang="gl" title="Galego"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><path d="M-1 -1 L31 21" stroke="#0099CC" stroke-width="5"/></svg></button>
      <button data-lang="ca" title="Català"><svg viewBox="0 0 30 18"><rect width="30" height="18" fill="#FCDD09"/><g fill="#DA121A"><rect y="2" width="30" height="2"/><rect y="6" width="30" height="2"/><rect y="10" width="30" height="2"/><rect y="14" width="30" height="2"/></g></svg></button>
      <button data-lang="eu" title="Euskara"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#D52B1E"/><path d="M0 0L30 20M30 0L0 20" stroke="#009B48" stroke-width="3"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="3"/></svg></button>
      <button data-lang="es" title="Castellano"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="rand" data-i="random"></button>
    <button role="tab" data-tab="mix" data-i="mix"></button>
    <button role="tab" data-tab="top" data-i="top"></button>
    <button role="tab" data-tab="ana" data-i="anatomy"></button>
  </nav>

  <!-- ALEATORIO -->
  <section id="rand">
    <div class="card" id="randCard"></div>
    <div class="actions">
      <button class="btn main" id="randBtn" data-i="another"></button>
      <button class="btn sm" id="randBack" data-i="back"></button>
      <button class="btn sm" id="randCopy" data-i="share"></button>
      <span id="randVote"></span>
    </div>
  </section>

  <!-- MESTURA -->
  <section id="mix" hidden>
    <div class="toggle" role="group">
      <button data-mode="coh" data-i="coherent"></button>
      <button data-mode="chaos" data-i="chaos"></button>
    </div>
    <p class="hint" id="modeHint"></p>
    <button class="chip" id="famChip" hidden></button>
    <div class="card" id="mixCard"></div>
    <div class="actions">
      <button class="btn main" id="mixBtn" data-i="shuffle"></button>
      <div class="row">
        <button class="btn h sm" id="swapH" data-i="first"></button>
        <button class="btn t sm" id="swapT" data-i="second"></button>
      </div>
      <button class="btn sm" id="mixBack" data-i="back"></button>
      <button class="btn sm" id="mixSave" data-i="save"></button>
      <button class="btn sm" id="mixCopy" data-i="share"></button>
    </div>
    <h2 data-i="saved"></h2>
    <ul class="favs" id="favs"></ul>
  </section>

  <!-- TOP -->
  <section id="top" hidden>
    <input class="search" id="q" type="search" data-ph="searchPh" autocomplete="off">
    <p class="hint" id="qCount"></p>
    <ul class="list" id="qList"></ul>
    <h2 data-i="topTitle"></h2>
    <ol class="list" id="topList"></ol>
  </section>

  <!-- ANATOMÍA -->
  <section id="ana" hidden>
    <p class="intro" data-i="intro"></p>
    <div class="legend"><span class="lh" data-i="head"></span><span class="lt" data-i="tail"></span></div>
    <p class="big" id="combos"></p>
    <div id="fams"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- REFRANES ----------
   Formato: cabeza| cola  (la coma antes de "|" indica que la cola se une con coma)
   Familias: q=Quien… m=Más… que… a=A… n=No… c=Cuando… d=Donde… e=De… en=En… g=libres */
const DATA = `
#q
Quien madruga,| Dios le ayuda
Quien mucho abarca,| poco aprieta
Quien a buen árbol se arrima,| buena sombra le cobija
Quien siembra vientos,| recoge tempestades
Quien calla,| otorga
Quien ríe el último,| ríe mejor
Quien bien te quiere,| te hará llorar
Quien no llora,| no mama
Quien tiene un amigo,| tiene un tesoro
Quien guarda,| halla
Quien con niños se acuesta,| mojado se levanta
Quien la sigue,| la consigue
Quien busca,| encuentra
Quien fue a Sevilla,| perdió su silla
Quien avisa,| no es traidor
Quien tiene boca,| se equivoca
Quien roba a un ladrón,| tiene cien años de perdón
Quien mal anda,| mal acaba
Quien no se arriesga,| no cruza el río
Quien espera,| desespera
Quien parte y reparte,| se queda con la mejor parte
Quien da primero,| da dos veces
Quien se pica,| ajos come
Quien mucho habla,| mucho yerra
Quien hace la ley,| hace la trampa
Quien no tiene cabeza,| tiene que tener pies
Quien canta,| su mal espanta
Quien con lobos anda,| a aullar se enseña
Quien escupe al cielo,| en la cara le cae
Quien pregunta,| no yerra
Quien tiene padrino,| se bautiza
Quien juega con fuego,| se quema
Quien a hierro mata,| a hierro muere
Quien dice lo que quiere,| oye lo que no quiere
Quien tuvo,| retuvo
Quien no ha visto Sevilla,| no ha visto maravilla
Quien no oye consejo,| no llega a viejo
Quien bien siembra,| bien recoge
Quien paga,| manda
Quien tiene tienda,| que la atienda
Quien mucho duerme,| poco aprende
Quien adelante no mira,| atrás se queda
Quien bien ata,| bien desata
#m
Más vale pájaro en mano| que ciento volando
Más vale tarde| que nunca
Más vale prevenir| que curar
Más vale solo| que mal acompañado
Más vale maña| que fuerza
Más vale ponerse una vez colorado| que ciento amarillo
Más vale ser cabeza de ratón| que cola de león
Más vale lo malo conocido| que lo bueno por conocer
Más vale caer en gracia| que ser gracioso
Más vale un toma| que dos te daré
Más sabe el diablo por viejo| que por diablo
Más vale honra sin barcos| que barcos sin honra
Más vale llegar a tiempo| que rondar un año
Más vale callar| que mal hablar
Más ven cuatro ojos| que dos
Más vale paso que dure| que trote que canse
Más vale amigo en la plaza| que dinero en el arca
Más vale algo| que nada
Más vale una imagen| que mil palabras
Más es el ruido| que las nueces
Más largo| que un día sin pan
Más contento| que unas castañuelas
Más feo| que pegarle a un padre
Más perdido| que un pulpo en un garaje
Más listo| que el hambre
Más viejo| que Matusalén
Más pesado| que una vaca en brazos
Más corto| que las mangas de un chaleco
Más sordo| que una tapia
Más claro| que el agua
Más tieso| que un ajo
Más fresco| que una lechuga
Más vago| que la chaqueta de un guardia
Más raro| que un perro verde
Es peor el remedio| que la enfermedad
Hay más días| que longanizas
No hay peor ciego| que el que no quiere ver
No hay peor sordo| que el que no quiere oír
No es lo mismo predicar| que dar trigo
Antes se coge al mentiroso| que al cojo
#a
A caballo regalado,| no le mires el diente
A palabras necias,| oídos sordos
A buen entendedor,| pocas palabras bastan
A falta de pan,| buenas son tortas
A mal tiempo,| buena cara
A rey muerto,| rey puesto
A cada cerdo| le llega su San Martín
A otro perro| con ese hueso
A lo hecho,| pecho
A la tercera| va la vencida
A quien Dios se la dé,| San Pedro se la bendiga
A Dios rogando| y con el mazo dando
A buenas horas,| mangas verdes
A grandes males,| grandes remedios
A río revuelto,| ganancia de pescadores
A perro flaco,| todo son pulgas
A gato viejo,| rata tierna
A la fuerza| ahorcan
A mucha hambre,| no hay pan duro
A enemigo que huye,| puente de plata
A cada pajarillo| le gusta su nidillo
Al mejor cazador| se le va la liebre
Al buen pagador| no le duelen prendas
Al que le pique,| que se rasque
Al que no quiere caldo,| taza y media
Al mal paso,| darle prisa
Al pan, pan,| y al vino, vino
Al freír| será el reír
A buen hambre| no hay pan duro
#n
No por mucho madrugar| amanece más temprano
No hay mal| que por bien no venga
No hay dos| sin tres
No hay mal| que cien años dure
No es oro| todo lo que reluce
No dejes para mañana| lo que puedas hacer hoy
No se ganó Zamora| en una hora
No hay rosa| sin espinas
No todo el monte| es orégano
No se puede repicar| y andar en la procesión
No hay que vender la piel del oso| antes de cazarlo

No es tan fiero el león| como lo pintan

No hay bien| que dure ni mal que no se acabe
Nunca es tarde| si la dicha es buena
Nunca digas| de esta agua no beberé

#c
Cuando el río suena,| agua lleva

Cuando una puerta se cierra,| otra se abre
Cuando a Roma fueres,| haz lo que vieres
Cuando el diablo no tiene qué hacer,| mata moscas con el rabo
Cuando marzo mayea,| mayo marcea
Cuando el hambre entra por la puerta,| el amor sale por la ventana
Cuando no hay lomo,| de todo como
Cuando la pobreza entra por la puerta,| la honra salta por la ventana
Cuando seas padre,| comerás huevos
Cuando el grajo vuela bajo,| hace un frío del carajo
#d
Donde las dan,| las toman
Donde fueres,| haz lo que vieres
Donde hay patrón,| no manda marinero
Donde comen dos,| comen tres
Donde menos se espera,| salta la liebre
Donde hubo fuego,| cenizas quedan
Donde no hay harina,| todo es mohína
Donde hay confianza,| da asco
Donde manda capitán,| no manda marinero
#e
De tal palo,| tal astilla
De noche,| todos los gatos son pardos

};
let lang = store.get('ref_lang','gl');

/* ---------- UTIL ---------- */
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const join = (h, t) => h.head + (t.comma ? ', ' : ' ') + t.tail + '.';
const toast = msg => { const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
const copy = txt => { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(T('copied'))).catch(() => toast(txt)); };
const inLang = r => r.l === lang;
function pool(l, f){ return R.filter(r => (l ? r.l === l : inLang(r)) && (!f || r.f === f)); }
const byLine = r => r.pid ? `${T('by')} ${r.author || T('anon')}${r.place ? ' (' + r.place + ')' : ''}` : '';
const meanLine = r => r.meaning ? `${T('meanL')}: ${r.meaning}` : '';

function cardHTML(h, t, animH, animT, tag, foot){
  return (tag ? `<span class="tag${tag === T('today') ? ' today' : ''}">${esc(tag)}</span>` : '') +
    `<div class="half h ${animH ? 'in-l' : ''}">${esc(h.head)}${t.comma ? ',' : ''}</div>` +
    `<div class="seam"></div>` +
    `<div class="half t ${animT ? 'in-r' : ''}">${esc(t.tail)}.</div>` +
    ((foot = [].concat(foot || []).filter(Boolean)).length ? `<div class="foot">${foot.map(esc).join('<br>')}</div>` : '');
}

/* ---------- FAVORITOS ♥ (gardados neste dispositivo) ---------- */
const online = true;
let myVotes = store.get('ref_hearts', {});
function voteBtn(r){
  const on = !!myVotes[r.id];
  return `<button class="vote" data-vote="${r.id}" aria-pressed="${on}" aria-label="${T('voteT')}">${on ? '♥' : '♡'}</button>`;
}
function toggleVote(id){
  const next = { ...myVotes };
  if (next[id]) delete next[id]; else next[id] = Date.now();
  myVotes = next; store.set('ref_hearts', myVotes);
  refreshVotes();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vote]'); if (b) toggleVote(b.dataset.vote);
});
function refreshVotes(){
  if (cur) $('randVote').innerHTML = voteBtn(cur);
  if (!$('top').hidden) renderTop();
}
function initOnline(){}
function renderOnline(){ refreshVotes(); }

/* ---------- ALEATORIO ---------- */
let cur = null, todayRef = null;
function dayPick(){
  const d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + lang;
  const p = BASE.filter(r => r.l === lang);
  return p[parseInt(hash(key), 36) % p.length];
}
const hR = [], hM = [];
const pushM = () => { if (mh && mt) hM.push([mh, mt]); };
function newRandom(){
  const p = pool();
  let r; do { r = rnd(p); } while (p.length > 1 && r === cur);
  if (cur) hR.push(cur);
  cur = r; renderRandom(true);
}
function renderRandom(anim){
  $('randBack').disabled = !hR.length;
  $('randCard').innerHTML = cardHTML(cur, cur, anim, anim, cur === todayRef ? T('today') : famName(cur.l, cur.f), [meanLine(cur), byLine(cur)]);
  $('randVote').innerHTML = voteBtn(cur);
}

/* ---------- MESTURA ---------- */
let mode = store.get('ref_mode','coh');
let famFilter = null;           // {l, f}
let mh = null, mt = null;
const basePool = () => famFilter ? pool(famFilter.l, famFilter.f) : pool();
function pickHead(){
  const p = basePool();
  let x; do { x = rnd(p); } while (p.length > 1 && x === mh);
  return x;
}
function pickTail(h){
  const p = mode === 'coh' ? pool(h.l, h.f) : basePool();
  const ok = p.filter(r => r !== h && r.tail !== h.tail && r !== mt);
  return ok.length ? rnd(ok) : rnd(R.filter(r => r !== h && r.l === h.l));
}
function newMix(){ pushM(); mh = pickHead(); mt = pickTail(mh); renderMix(true, true); }
function swapHead(){
  pushM();
  const p = mode === 'coh' ? pool(mt.l, mt.f) : basePool();
  const ok = p.filter(r => r !== mt && r !== mh && r.head !== mt.head);
  if (ok.length) mh = rnd(ok);
  renderMix(true, false);
}
function swapTail(){ pushM(); mt = pickTail(mh); renderMix(false, true); }
function renderMix(aH, aT){
  $('mixBack').disabled = !hM.length;
  $('mixCard').innerHTML = cardHTML(mh, mt, aH, aT) +
    `<div class="origin"><b>${T('origin')}</b>
      <p class="dh">${esc(join(mh, mh))}</p>
      <p class="dt">${esc(join(mt, mt))}</p></div>`;
}
function renderMode(){
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  $('modeHint').textContent = T(mode === 'coh' ? 'coherentHint' : 'chaosHint');
  const chip = $('famChip');
  if (famFilter){ chip.hidden = false; chip.textContent = `${T('onlyFam')}: ${famName(famFilter.l, famFilter.f)}  ✕`; }
  else chip.hidden = true;
}

/* ---------- FAVORITOS ---------- */
let favs = store.get('ref_favs', []);
function renderFavs(){
  const ul = $('favs');
  if (!favs.length){ ul.innerHTML = `<li class="empty">${T('empty')}</li>`; return; }
  ul.innerHTML = favs.map((f, i) => `<li><span>${esc(f)}</span><button class="x" data-del="${i}" aria-label="✕">✕</button></li>`).join('');
}
$('favs').addEventListener('click', e => {
  const i = e.target.dataset.del; if (i === undefined) return;
  favs.splice(+i, 1); store.set('ref_favs', favs); renderFavs();
});

/* ---------- TOP ---------- */
function rowHTML(r, extra, own){
  const ex = [].concat(extra || []).filter(Boolean).map(t => `<small>${esc(t)}</small>`).join('');
  return `<li><span class="rt"><span class="eh">${esc(r.head)}${r.comma ? ',' : ''}</span> <span class="et">${esc(r.tail)}.</span>${ex}</span>${voteBtn(r)}</li>`;
}
function renderTop(){
  const mine = pool().filter(r => myVotes[r.id]).sort((a, b) => myVotes[b.id] - myVotes[a.id]);
  $('topList').innerHTML = mine.length ? mine.map(r => rowHTML(r, [meanLine(r)])).join('') : `<li class="empty">${T('noVotes')}</li>`;
}

/* ---------- BUSCAR ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function renderSearch(){
  const q = norm($('q').value.trim());
  const ws = q.split(/\s+/).filter(w => w.length > 1);
  if (!ws.length){ $('qList').innerHTML = ''; $('qCount').textContent = ''; return; }
  const res = pool().filter(r => { const t = norm(r.head + ' ' + r.tail + ' ' + (r.meaning || '')); return ws.every(w => t.includes(w)); });
  $('qCount').textContent = res.length ? T('results', { n: res.length }) : '';
  $('qList').innerHTML = res.length
    ? res.slice(0, 60).map(r => rowHTML(r, [meanLine(r), byLine(r)])).join('')
    : `<li class="empty">${T('noRes')}</li>`;
}
let qT = 0;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(renderSearch, 150); });

/* ---------- ANATOMÍA ---------- */
function renderAna(){
  const n = pool().length;
  $('combos').textContent = T('combos', { n, z: (n * (n - 1)).toLocaleString(lang) });
  const all = FAMS[lang].map(([f]) => pool(lang, f).length);
  const max = Math.max(...all);
  $('fams').innerHTML = FAMS[lang].map(([f]) => {
    const p = pool(lang, f); if (!p.length) return '';
    const ex = rnd(p);
    return `<div class="fam">
      <div class="fam-top"><span class="fam-name">${esc(famName(lang, f))}</span><span class="fam-n">${T('count', { n: p.length })}</span></div>
      <div class="bar"><i style="width:${(p.length / max * 100).toFixed(1)}%"></i></div>
      <p class="ex"><span class="eh">${esc(ex.head)}${ex.comma ? ',' : ''}</span> <span class="et">${esc(ex.tail)}.</span></p>
      <button class="btn sm" data-fam="${f}" data-l="${lang}">${T('mixFam')}</button>
    </div>`;
  }).join('');
}
$('fams').addEventListener('click', e => {
  const f = e.target.dataset.fam; if (!f) return;
  famFilter = { l: e.target.dataset.l, f }; mode = 'coh'; store.set('ref_mode', mode);
  showTab('mix'); renderMode(); newMix();
});

/* ---------- TABS / IDIOMA ---------- */
const TABS = ['rand','mix','top','ana'];
function showTab(t){
  document.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  TABS.forEach(s => $(s).hidden = s !== t);
  if (t === 'ana') renderAna();
  if (t === 'top') renderTop();
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = T(el.dataset.ph));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderMode(); renderFavs(); renderRandom(false); renderMix(false, false);
  if (!$('ana').hidden) renderAna();
  if (!$('top').hidden) renderTop();
}

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; store.set('ref_lang', lang);
  famFilter = null; hR.length = 0; hM.length = 0;
  cur = todayRef = dayPick(); mh = null; mt = null; mh = pickHead(); mt = pickTail(mh);
  $('q').value = ''; applyLang(); renderSearch();
});
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; store.set('ref_mode', mode); renderMode(); newMix(); });
$('famChip').onclick = () => { famFilter = null; renderMode(); newMix(); };
$('randBtn').onclick = newRandom;
$('randBack').onclick = () => { if (hR.length) { cur = hR.pop(); renderRandom(true); } };
$('mixBack').onclick = () => { if (hM.length) { [mh, mt] = hM.pop(); renderMix(true, true); } };
function share(txt){
  const text = txt + '\n— Refrankenstein';
  if (navigator.share) navigator.share({ text }).catch(e => { if (!e || e.name !== 'AbortError') copy(txt); });
  else copy(txt);
}
$('randCopy').onclick = () => share(join(cur, cur));
$('mixBtn').onclick = newMix;
$('swapH').onclick = swapHead;
$('swapT').onclick = swapTail;
$('mixCopy').onclick = () => share(join(mh, mt));
$('mixSave').onclick = () => {
  const s = join(mh, mt);
  if (!favs.includes(s)){ favs.unshift(s); store.set('ref_favs', favs); renderFavs(); }
  toast(T('savedT'));
};
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select,button') && e.key === ' ') return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const r = !$('rand').hidden, m = !$('mix').hidden;
  if (!r && !m) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); r ? newRandom() : newMix(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); (r ? $('randBack') : $('mixBack')).click(); }
  else if (m && e.key === '1') swapHead();
  else if (m && e.key === '2') swapTail();
});

cur = todayRef = dayPick(); mh = pickHead(); mt = pickTail(mh);
showTab('rand'); applyLang(); renderOnline();
initOnline();

</script>
</body>
</html>
