<!DOCTYPE html>
<html lang="es" data-skin="azulejo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refrankenstein</title>
<meta name="description" content="Refranes en castellano, galego, català y euskera: refrán del día, mezcla de mitades, buscador y favoritos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens base (Azulejo) ===== */
:root{
  --bg:#E9EDF4; --bgimg:none; --paper:#FBFCFE; --card:#FBFCFE; --ink:#16203F; --soft:#5A6585;
  --head:#2340B5; --headbg:#DCE3FA; --tail:#9A6A00; --tailbg:#FCEFC4; --seam:#F2B705; --line:#C9D1E3;
  --accent:#16203F; --accentInk:#FBFCFE; --pill:#F2B705; --pillInk:#16203F;
  --ft:"Young Serif",Georgia,serif; --fx:"Young Serif",Georgia,serif; --fu:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --cardborder:1px solid var(--line); --cardshadow:none; --tilt:0deg;
  --seam-h:0px; --seam-bg:none;
  --fxsize:clamp(1.75rem,7.6vw,2.4rem); --fxstyle:normal; --fxweight:400;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root[data-skin="azulejo"]:not([data-theme="light"]){
    --bg:#0F1528; --paper:#18203A; --card:#18203A; --ink:#E8ECF7; --soft:#9AA5C4;
    --head:#9DB0FF; --headbg:#22306B; --tail:#FFD15C; --tailbg:#4A3A10; --line:#2C365A; --accent:#E8ECF7; --accentInk:#0F1528;
  }
}
:root[data-skin="azulejo"][data-theme="dark"]{
  --bg:#0F1528; --paper:#18203A; --card:#18203A; --ink:#E8ECF7; --soft:#9AA5C4;
  --head:#9DB0FF; --headbg:#22306B; --tail:#FFD15C; --tailbg:#4A3A10; --line:#2C365A; --accent:#E8ECF7; --accentInk:#0F1528;
}

/* ===== Estrutura ===== */
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--ink);font-family:var(--fu);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
h1{font-family:var(--ft);font-weight:400;font-size:1.55rem;margin:0;line-height:1.1;letter-spacing:-.01em}
h1 span{color:var(--head)} h1 em{font-style:normal;color:var(--tail)}
.hbtns{display:flex;gap:6px}
.hbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;height:36px;min-width:42px;padding:0 8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font:500 .85rem var(--fu)}
.hbtn svg{width:26px;height:17px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.hbtn .ico{width:20px;height:20px;box-shadow:none;border-radius:0}
.pop{position:absolute;right:0;top:44px;z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);min-width:190px}
.pop h3{font:600 .75rem var(--fu);text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:4px 6px 6px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:8px;border-radius:9px;font:500 .95rem var(--fu);cursor:pointer;text-align:left}
.pop button[aria-pressed="true"]{background:var(--line)}
.pop svg{width:28px;height:18px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.tabs{display:flex;gap:3px;margin:10px 0 12px;background:var(--paper);padding:3px;border-radius:calc(var(--r) * .6 + 4px);border:1px solid var(--line)}
.tabs button{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;color:var(--soft);font:500 .88rem var(--fu);padding:7px 2px;border-radius:calc(var(--r) * .6);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accentInk)}
button:focus-visible{outline:3px solid var(--seam);outline-offset:2px}

/* tarxeta partida */
.card{background:var(--card);border-radius:var(--r);border:var(--cardborder);box-shadow:var(--cardshadow);overflow:hidden;transform:rotate(var(--tilt))}
.half{padding:22px 22px;line-height:1.2;font-family:var(--fx);font-size:var(--fxsize);font-style:var(--fxstyle);font-weight:var(--fxweight);line-height:1.25;position:relative}
.half.h{background:var(--headbg);color:var(--head)}
.half.t{background:var(--tailbg);color:var(--tail)}
.seam{height:var(--seam-h);background:var(--seam-bg);position:relative}
.tag{display:block;font:500 .72rem var(--fu);color:var(--soft);padding:9px 18px 0;letter-spacing:.02em}
.tag + .half{padding-top:8px}
.tag.today{color:var(--tail);font-weight:700}
.foot{font-size:.8rem;color:var(--soft);padding:8px 18px 12px;border-top:1px solid var(--line)}
.half.in-l{animation:inl .3s ease-out}
.half.in-r{animation:inr .3s ease-out}
@keyframes inl{from{transform:translateX(-24px);opacity:0}}
@keyframes inr{from{transform:translateX(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.half.in-l,.half.in-r{animation:none}}

.origin{padding-left:42px}

.origin{font-size:.75rem;color:var(--soft);padding:6px 20px 8px;border-top:1px solid var(--line)}
.origin summary{cursor:pointer;list-style:none;font-weight:500}
.origin summary::-webkit-details-marker{display:none}
.origin summary::before{content:'+ '}
.origin[open] summary::before{content:'− '}
.origin b{font-weight:600;color:var(--ink)}
.origin p{margin:2px 0}
.origin .dh{color:var(--head)} .origin .dt{color:var(--tail)}

/* botóns */
.bar1{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.bar2{display:flex;gap:8px;margin-top:8px}
.btn{border:1px solid var(--line);border-radius:calc(var(--r) * .5 + 4px);padding:10px 12px;font:500 .95rem var(--fu);cursor:pointer;background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--accent);color:var(--accentInk);border-color:var(--accent);flex:1;font-size:1.05rem;padding:12px}
.btn.ib{width:46px;padding:0;flex:none}
.btn.ib svg{width:20px;height:20px}
.btn:disabled{opacity:.35;cursor:default}
.bar2 .btn{flex:1;font-size:.85rem;padding:8px 6px}
.btn.h{color:var(--head)} .btn.t{color:var(--tail)}
#randVote{display:flex}
.vote{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:calc(var(--r) * .5 + 4px);min-width:46px;padding:0 10px;font:500 1.2rem var(--fu);cursor:pointer;line-height:1}
.vote[aria-pressed="true"]{color:#E0365A}
.list .vote{min-height:36px;font-size:1.05rem}

.toggle{display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:4px}
.toggle button{flex:1;border:0;background:none;padding:6px;border-radius:999px;font:500 .85rem var(--fu);color:var(--soft);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--pill);color:var(--pillInk)}
.hint{font-size:.78rem;color:var(--soft);margin:0 0 8px;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accentInk);border:0;border-radius:99px;padding:4px 11px;font:500 .8rem var(--fu);margin-bottom:8px;cursor:pointer}

h2{font-family:var(--ft);font-weight:400;font-size:1.2rem;margin:22px 0 6px}
.favs,.list{list-style:none;margin:0;padding:0}
.favs li,.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.favs li{font-family:var(--fx);font-style:var(--fxstyle);font-size:1rem}
.favs li span{flex:1}
.favs .x{border:0;background:none;color:var(--soft);font-size:1rem;cursor:pointer;padding:2px 6px}
ol.list{counter-reset:n}
.list .rt{flex:1;font-family:var(--fx);font-style:var(--fxstyle);font-weight:var(--fxweight);font-size:1rem;line-height:1.3}
.list .rt small{display:block;font-family:var(--fu);font-style:normal;font-weight:400;font-size:.75rem;color:var(--soft);margin-top:2px}
.eh{color:var(--head)} .et{color:var(--tail)}
.empty{color:var(--soft);font-size:.9rem}
.search{font:400 1rem var(--fu);padding:10px 12px;border-radius:calc(var(--r) * .5 + 4px);border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%;margin-bottom:4px}

.intro{font-size:.92rem;margin:0 0 8px}
.legend{display:flex;gap:6px;margin:6px 0}
.legend span{padding:4px 10px;border-radius:7px;font-weight:600;font-size:.82rem}
.legend .lh{background:var(--headbg);color:var(--head);box-shadow:inset 0 0 0 1px var(--line)} .legend .lt{background:var(--tailbg);color:var(--tail);box-shadow:inset 0 0 0 1px var(--line)}
.big{font-family:var(--ft);font-size:1.05rem;margin:12px 0 4px}
.fam{border-top:1px solid var(--line);padding:10px 0}
.fam-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fam-name{font-family:var(--fx);font-size:1.05rem}
.fam-n{font-size:.8rem;color:var(--soft)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--head) 0 50%,var(--tail) 50%)}
.ex{font-size:.88rem;margin:0 0 6px;font-family:var(--fx);font-style:var(--fxstyle)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(90px);background:var(--accent);color:var(--accentInk);padding:9px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;font-weight:500;transition:transform .25s;pointer-events:none;z-index:30}
.toast.on{transform:translateX(-50%) translateY(0)}
mark{background:var(--pill);color:var(--pillInk);border-radius:3px;padding:0 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Refrank</span><em>enstein</em></h1>
    <div class="hbtns">
      <button class="hbtn" id="flagBtn" data-al="langL" aria-haspopup="true"></button>
    </div>
    <div class="pop" id="langMenu" hidden role="menu">
      <h3 data-i="langL"></h3>
      <button data-lang="es"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>Castellano</button>
      <button data-lang="gl"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><path d="M-1 -1 L31 21" stroke="#0099CC" stroke-width="5"/></svg>Galego</button>
      <button data-lang="ca"><svg viewBox="0 0 30 18"><rect width="30" height="18" fill="#FCDD09"/><g fill="#DA121A"><rect y="2" width="30" height="2"/><rect y="6" width="30" height="2"/><rect y="10" width="30" height="2"/><rect y="14" width="30" height="2"/></g></svg>Català</button>
      <button data-lang="eu"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#D52B1E"/><path d="M0 0L30 20M30 0L0 20" stroke="#009B48" stroke-width="3"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="3"/></svg>Euskara</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="rand" data-i="random"></button>
    <button role="tab" data-tab="mix" data-i="mix"></button>
    <button role="tab" data-tab="top" data-i="top"></button>
    <button role="tab" data-tab="ana" data-i="anatomy"></button>
  </nav>

  <!-- ALEATORIO -->
  <section id="rand">
    <div class="card" id="randCard"></div>
    <div class="bar1">
      <button class="btn ib" id="randBack" data-al="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn main" id="randBtn" data-i="another"></button>
      <span id="randVote"></span>
      <button class="btn ib" id="randCopy" data-al="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    </div>
  </section>

  <!-- MESTURA -->
  <section id="mix" hidden>
    <div class="toggle" role="group">
      <button data-mode="coh" data-i="coherent"></button>
      <button data-mode="chaos" data-i="chaos"></button>
    </div>
    <p class="hint" id="modeHint"></p>
    <button class="chip" id="famChip" hidden></button>
    <div class="card" id="mixCard"></div>
    <div class="bar1">
      <button class="btn ib" id="mixBack" data-al="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn main" id="mixBtn" data-i="shuffle"></button>
      <button class="btn ib" id="mixSave" data-al="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
      <button class="btn ib" id="mixCopy" data-al="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    </div>
    <div class="bar2">
      <button class="btn h" id="swapH" data-i="first"></button>
      <button class="btn t" id="swapT" data-i="second"></button>
    </div>
    <h2 data-i="saved"></h2>
    <ul class="favs" id="favs"></ul>
  </section>

  <!-- BUSCAR / FAVORITOS -->
  <section id="top" hidden>
    <input class="search" id="q" type="search" data-ph="searchPh" autocomplete="off">
    <p class="hint" id="qCount"></p>
    <ul class="list" id="qList"></ul>
    <h2 data-i="topTitle"></h2>
    <ol class="list" id="topList"></ol>
  </section>

  <!-- ANATOMÍA -->
  <section id="ana" hidden>
    <p class="intro" data-i="intro"></p>
    <div class="legend"><span class="lh" data-i="head"></span><span class="lt" data-i="tail"></span></div>
    <p class="big" id="combos"></p>
    <div id="fams"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- REFRANES ----------
   Formato: cabeza| cola  (la coma antes de "|" indica que la cola se une con coma)
   Familias: q=Quien… m=Más… que… a=A… n=No… c=Cuando… d=Donde… e=De… en=En… g=libres */
const DATA = `
#q
Quien madruga,| Dios le ayuda
Quien mucho abarca,| poco aprieta
Quien a buen árbol se arrima,| buena sombra le cobija
Quien siembra vientos,| recoge tempestades
Quien calla,| otorga
Quien ríe el último,| ríe mejor
Quien bien te quiere,| te hará llorar
Quien no llora,| no mama
Quien tiene un amigo,| tiene un tesoro
Quien guarda,| halla
Quien con niños se acuesta,| mojado se levanta
Quien la sigue,| la consigue
Quien busca,| encuentra
Quien fue a Sevilla,| perdió su silla
Quien avisa,| no es traidor
Quien tiene boca,| se equivoca
Quien roba a un ladrón,| tiene cien años de perdón
Quien mal anda,| mal acaba
Quien no se arriesga,| no cruza el río
Quien espera,| desespera
Quien parte y reparte,| se queda con la mejor parte
Quien da primero,| da dos veces
Quien se pica,| ajos come
Quien mucho habla,| mucho yerra
Quien hace la ley,| hace la trampa
Quien no tiene cabeza,| tiene que tener pies
Quien canta,| su mal espanta
Quien con lobos anda,| a aullar se enseña
Quien escupe al cielo,| en la cara le cae
Quien pregunta,| no yerra
Quien tiene padrino,| se bautiza
Quien juega con fuego,| se quema
Quien a hierro mata,| a hierro muere
Quien dice lo que quiere,| oye lo que no quiere
Quien tuvo,| retuvo
Quien no ha visto Sevilla,| no ha visto maravilla
Quien no oye consejo,| no llega a viejo
Quien bien siembra,| bien recoge
Quien paga,| manda
Quien tiene tienda,| que la atienda
Quien mucho duerme,| poco aprende
Quien adelante no mira,| atrás se queda
Quien bien ata,| bien desata
#m
Más vale pájaro en mano| que ciento volando
Más vale tarde| que nunca
Más vale prevenir| que curar
Más vale solo| que mal acompañado
Más vale maña| que fuerza
Más vale ponerse una vez colorado| que ciento amarillo
Más vale ser cabeza de ratón| que cola de león
Más vale lo malo conocido| que lo bueno por conocer
Más vale caer en gracia| que ser gracioso
Más vale un toma| que dos te daré
Más sabe el diablo por viejo| que por diablo
Más vale honra sin barcos| que barcos sin honra
Más vale llegar a tiempo| que rondar un año
Más vale callar| que mal hablar
Más ven cuatro ojos| que dos
Más vale paso que dure| que trote que canse
Más vale amigo en la plaza| que dinero en el arca
Más vale algo| que nada
Más vale una imagen| que mil palabras
Más es el ruido| que las nueces
Más largo| que un día sin pan
Más contento| que unas castañuelas
Más feo| que pegarle a un padre
Más perdido| que un pulpo en un garaje
Más listo| que el hambre
Más viejo| que Matusalén
Más pesado| que una vaca en brazos
Más corto| que las mangas de un chaleco
Más sordo| que una tapia
Más claro| que el agua
Más tieso| que un ajo
Más fresco| que una lechuga
Más vago| que la chaqueta de un guardia
Más raro| que un perro verde
Es peor el remedio| que la enfermedad
Hay más días| que longanizas
No hay peor ciego| que el que no quiere ver
No hay peor sordo| que el que no quiere oír
No es lo mismo predicar| que dar trigo
Antes se coge al mentiroso| que al cojo
#a
A caballo regalado,| no le mires el diente
A palabras necias,| oídos sordos
A buen entendedor,| pocas palabras bastan
A falta de pan,| buenas son tortas
A mal tiempo,| buena cara
A rey muerto,| rey puesto
A cada cerdo| le llega su San Martín
A otro perro| con ese hueso
A lo hecho,| pecho
A la tercera| va la vencida
A quien Dios se la dé,| San Pedro se la bendiga
A Dios rogando| y con el mazo dando
A buenas horas,| mangas verdes
A grandes males,| grandes remedios
A río revuelto,| ganancia de pescadores
A perro flaco,| todo son pulgas
A gato viejo,| rata tierna
A la fuerza| ahorcan
A mucha hambre,| no hay pan duro
A enemigo que huye,| puente de plata
A cada pajarillo| le gusta su nidillo
Al mejor cazador| se le va la liebre
Al buen pagador| no le duelen prendas
Al que le pique,| que se rasque
Al que no quiere caldo,| taza y media
Al mal paso,| darle prisa
Al pan, pan,| y al vino, vino
Al freír| será el reír
A buen hambre| no hay pan duro
#n
No por mucho madrugar| amanece más temprano
No hay mal| que por bien no venga
No hay dos| sin tres
No hay mal| que cien años dure
No es oro| todo lo que reluce
No dejes para mañana| lo que puedas hacer hoy
No se ganó Zamora| en una hora
No hay rosa| sin espinas
No todo el monte| es orégano
No se puede repicar| y andar en la procesión
No hay que vender la piel del oso| antes de cazarlo

No es tan fiero el león| como lo pintan
No hay atajo| sin trabajo
No hay que buscarle tres pies| al gato

No se acuerda el cura| de cuando fue sacristán
No hay bien| que dure ni mal que no se acabe
Nunca es tarde| si la dicha es buena
Nunca digas| de esta agua no beberé
Nunca llueve| a gusto de todos
#c
Cuando el río suena,| agua lleva
Cuando las barbas de tu vecino veas pelar,| pon las tuyas a remojar

Cuando una puerta se cierra,| otra se abre
Cuando a Roma fueres,| haz lo que vieres
Cuando el diablo no tiene qué hacer,| mata moscas con el rabo

let lang = store.get('rk_lang','es');
if (!LANGS.includes(lang)) lang = 'es';
const T = (k, vars={}) => (I18N[lang][k] || k).replace(/\{(\w+)\}/g, (_, v) => vars[v]);

/* ---------- UTIL ---------- */
const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fin = t => /[.!?…»”"]$/.test(t) ? '' : '.';
const join = (h, t) => h.head + (t.comma ? ', ' : ' ') + t.tail + fin(t.tail);
const toast = msg => { const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
const copy = txt => { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(T('copied'))).catch(() => toast(txt)); };
const inLang = r => r.l === lang;
function pool(l, f){ return R.filter(r => (l ? r.l === l : inLang(r)) && (!f || r.f === f)); }
const byLine = r => r.pid ? `${T('by')} ${r.author || T('anon')}${r.place ? ' (' + r.place + ')' : ''}` : '';
const meanLine = r => r.meaning ? `${T('meanL')}: ${r.meaning}` : '';

function cardHTML(h, t, animH, animT, tag, foot){
  return (tag ? `<span class="tag${tag === T('today') ? ' today' : ''}">${esc(tag)}</span>` : '') +
    `<div class="half h ${animH ? 'in-l' : ''}">${esc(h.head)}${t.comma ? ',' : ''}</div>` +
    `<div class="seam"></div>` +
    `<div class="half t ${animT ? 'in-r' : ''}">${esc(t.tail)}${fin(t.tail)}</div>` +
    ((foot = [].concat(foot || []).filter(Boolean)).length ? `<div class="foot">${foot.map(esc).join('<br>')}</div>` : '');
}

/* ---------- FAVORITOS ♥ (gardados neste dispositivo) ---------- */
const online = true;
let myVotes = store.get('ref_hearts', {});
function voteBtn(r){
  const on = !!myVotes[r.id];
  return `<button class="vote" data-vote="${r.id}" aria-pressed="${on}" aria-label="${T('voteT')}">${on ? '♥' : '♡'}</button>`;
}
function toggleVote(id){
  const next = { ...myVotes };
  if (next[id]) delete next[id]; else next[id] = Date.now();
  myVotes = next; store.set('ref_hearts', myVotes);
  refreshVotes();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vote]'); if (b) toggleVote(b.dataset.vote);
});
function refreshVotes(){
  if (cur) $('randVote').innerHTML = voteBtn(cur);
  if (!$('top').hidden) renderTop();
}
function initOnline(){}
function renderOnline(){ refreshVotes(); }

/* ---------- ALEATORIO ---------- */
let cur = null, todayRef = null;
function dayPick(){
  const d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + lang;
  const p = BASE.filter(r => r.l === lang);
  return p[parseInt(hash(key), 36) % p.length];
}
const hR = [], hM = [];
const pushM = () => { if (mh && mt) hM.push([mh, mt]); };
function newRandom(){
  const p = pool();
  let r; do { r = rnd(p); } while (p.length > 1 && r === cur);
  if (cur) hR.push(cur);
  cur = r; renderRandom(true);
}
function renderRandom(anim){
  $('randBack').disabled = !hR.length;
  $('randCard').innerHTML = cardHTML(cur, cur, anim, anim, cur === todayRef ? T('today') : '', [meanLine(cur), byLine(cur)]);
  $('randVote').innerHTML = voteBtn(cur);
}

/* ---------- MESTURA ---------- */
let mode = store.get('ref_mode','coh');
let famFilter = null;           // {l, f}
let mh = null, mt = null;
const basePool = () => famFilter ? pool(famFilter.l, famFilter.f) : pool();
function pickHead(){
  const p = basePool();
  let x; do { x = rnd(p); } while (p.length > 1 && x === mh);
  return x;
}
function pickTail(h){
  const p = mode === 'coh' ? pool(h.l, h.f) : basePool();
  const ok = p.filter(r => r !== h && r.tail !== h.tail && r !== mt);
  return ok.length ? rnd(ok) : rnd(R.filter(r => r !== h && r.l === h.l));
}
function newMix(){ pushM(); mh = pickHead(); mt = pickTail(mh); renderMix(true, true); }
function swapHead(){
  pushM();
  const p = mode === 'coh' ? pool(mt.l, mt.f) : basePool();
  const ok = p.filter(r => r !== mt && r !== mh && r.head !== mt.head);
  if (ok.length) mh = rnd(ok);
  renderMix(true, false);
}
function swapTail(){ pushM(); mt = pickTail(mh); renderMix(false, true); }
function renderMix(aH, aT){
  $('mixBack').disabled = !hM.length;
  $('mixCard').innerHTML = cardHTML(mh, mt, aH, aT) +
    `<details class="origin"><summary>${T('origin')}</summary>
      <p class="dh">${esc(join(mh, mh))}</p>
      <p class="dt">${esc(join(mt, mt))}</p></details>`;
}
function renderMode(){
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  $('modeHint').textContent = T(mode === 'coh' ? 'coherentHint' : 'chaosHint');
  const chip = $('famChip');
  if (famFilter){ chip.hidden = false; chip.textContent = `${T('onlyFam')}: ${famName(famFilter.l, famFilter.f)}  ✕`; }
  else chip.hidden = true;
}

/* ---------- FAVORITOS ---------- */
let favs = store.get('ref_favs', []);
function renderFavs(){
  const ul = $('favs');
  if (!favs.length){ ul.innerHTML = `<li class="empty">${T('empty')}</li>`; return; }
  ul.innerHTML = favs.map((f, i) => `<li><span>${esc(f)}</span><button class="x" data-del="${i}" aria-label="✕">✕</button></li>`).join('');
}
$('favs').addEventListener('click', e => {
  const i = e.target.dataset.del; if (i === undefined) return;
  favs.splice(+i, 1); store.set('ref_favs', favs); renderFavs();
});

/* ---------- TOP ---------- */
function rowHTML(r, extra, own){
  const ex = [].concat(extra || []).filter(Boolean).map(t => `<small>${esc(t)}</small>`).join('');
  return `<li><span class="rt"><span class="eh">${esc(r.head)}${r.comma ? ',' : ''}</span> <span class="et">${esc(r.tail)}${fin(r.tail)}</span>${ex}</span>${voteBtn(r)}</li>`;
}
function renderTop(){
  const mine = pool().filter(r => myVotes[r.id]).sort((a, b) => myVotes[b.id] - myVotes[a.id]);
  $('topList').innerHTML = mine.length ? mine.map(r => rowHTML(r, [meanLine(r)])).join('') : `<li class="empty">${T('noVotes')}</li>`;
}

/* ---------- BUSCAR ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function renderSearch(){
  const q = norm($('q').value.trim());
  const ws = q.split(/\s+/).filter(w => w.length > 1);
  if (!ws.length){ $('qList').innerHTML = ''; $('qCount').textContent = ''; return; }
  const res = pool().filter(r => { const t = norm(r.head + ' ' + r.tail + ' ' + (r.meaning || '')); return ws.every(w => t.includes(w)); });
  $('qCount').textContent = res.length ? T('results', { n: res.length }) : '';
  $('qList').innerHTML = res.length
    ? res.slice(0, 60).map(r => rowHTML(r, [meanLine(r), byLine(r)])).join('')
    : `<li class="empty">${T('noRes')}</li>`;
}
let qT = 0;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(renderSearch, 150); });

/* ---------- ANATOMÍA ---------- */
function renderAna(){
  const n = pool().length;
  $('combos').textContent = T('combos', { n, z: (n * (n - 1)).toLocaleString(lang) });
  const all = FAMS[lang].map(([f]) => pool(lang, f).length);
  const max = Math.max(...all);
  $('fams').innerHTML = FAMS[lang].map(([f]) => {
    const p = pool(lang, f); if (!p.length) return '';
    const ex = rnd(p);
    return `<div class="fam">
      <div class="fam-top"><span class="fam-name">${esc(famName(lang, f))}</span><span class="fam-n">${T('count', { n: p.length })}</span></div>
      <div class="bar"><i style="width:${(p.length / max * 100).toFixed(1)}%"></i></div>
      <p class="ex"><span class="eh">${esc(ex.head)}${ex.comma ? ',' : ''}</span> <span class="et">${esc(ex.tail)}${fin(ex.tail)}</span></p>
      <button class="btn sm" data-fam="${f}" data-l="${lang}">${T('mixFam')}</button>
    </div>`;
  }).join('');
}
$('fams').addEventListener('click', e => {
  const f = e.target.dataset.fam; if (!f) return;
  famFilter = { l: e.target.dataset.l, f }; mode = 'coh'; store.set('ref_mode', mode);
  showTab('mix'); renderMode(); newMix();
});

/* ---------- TABS / IDIOMA ---------- */
const TABS = ['rand','mix','top','ana'];
function showTab(t){
  document.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  TABS.forEach(s => $(s).hidden = s !== t);
  if (t === 'ana') renderAna();
  if (t === 'top') renderTop();
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = T(el.dataset.ph));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-al]').forEach(el => { el.setAttribute('aria-label', T(el.dataset.al)); el.title = T(el.dataset.al); });
  const fl = document.querySelector(`#langMenu [data-lang="${lang}"] svg`);
  if (fl) $('flagBtn').innerHTML = fl.outerHTML;
  renderMode(); renderFavs(); renderRandom(false); renderMix(false, false);
  if (!$('ana').hidden) renderAna();
  if (!$('top').hidden) renderTop();
}

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; store.set('rk_lang', lang); closeMenus();
  famFilter = null; hR.length = 0; hM.length = 0;
  cur = todayRef = dayPick(); mh = null; mt = null; mh = pickHead(); mt = pickTail(mh);
  $('q').value = ''; applyLang(); renderSearch();
});
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; store.set('ref_mode', mode); renderMode(); newMix(); });
$('famChip').onclick = () => { famFilter = null; renderMode(); newMix(); };
$('randBtn').onclick = newRandom;
$('randBack').onclick = () => { if (hR.length) { cur = hR.pop(); renderRandom(true); } };
$('mixBack').onclick = () => { if (hM.length) { [mh, mt] = hM.pop(); renderMix(true, true); } };
function share(txt){
  const text = txt + '\n— Refrankenstein';
  if (navigator.share) navigator.share({ text }).catch(e => { if (!e || e.name !== 'AbortError') copy(txt); });
  else copy(txt);
}
$('randCopy').onclick = () => share(join(cur, cur));
$('mixBtn').onclick = newMix;
$('swapH').onclick = swapHead;
$('swapT').onclick = swapTail;
$('mixCopy').onclick = () => share(join(mh, mt));
$('mixSave').onclick = () => {
  const s = join(mh, mt);
  if (!favs.includes(s)){ favs.unshift(s); store.set('ref_favs', favs); renderFavs(); }
  toast(T('savedT'));
};
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select,button') && e.key === ' ') return;
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const r = !$('rand').hidden, m = !$('mix').hidden;
  if (!r && !m) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); r ? newRandom() : newMix(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); (r ? $('randBack') : $('mixBack')).click(); }
  else if (m && e.key === '1') swapHead();
  else if (m && e.key === '2') swapTail();
});

/* ---------- MENÚS ---------- */
function closeMenus(){ $('langMenu').hidden = true; }
function toggleMenu(id){ const m = $(id), open = m.hidden; closeMenus(); m.hidden = !open; }
$('flagBtn').onclick = e => { e.stopPropagation(); toggleMenu('langMenu'); };
document.addEventListener('click', e => { if (!e.target.closest('.pop')) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

cur = todayRef = dayPick(); mh = pickHead(); mt = pickTail(mh);
showTab('rand'); applyLang(); renderOnline();
initOnline();

</script>
</body>
</html>
